<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hashtag Generator & Formatter — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
    button{cursor:pointer;font-family:inherit;}
    .btn{background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
    input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;width:100%;}
    input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
    .add-row{display:flex;gap:10px;margin-bottom:16px;}
    .add-row input{flex:1;}
    .tag-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;min-height:40px;}
    .tag-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;display:flex;align-items:center;gap:8px;}
    .tag-chip button{background:none;border:none;color:var(--text-dim);font-size:13px;padding:0;}
    .tag-chip button:hover{color:var(--danger);}
    .options-row{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
    .options-row label{font-size:13px;display:flex;align-items:center;gap:6px;}
    .output-box{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:18px;font-size:14px;line-height:1.8;word-break:break-word;min-height:60px;margin-bottom:16px;}
    .count-hint{font-size:12px;color:var(--text-dim);margin-bottom:24px;}
    .actions{display:flex;gap:10px;}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">47</span>
  <span class="nav-title">Hashtag Generator & Formatter</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>Hashtag Generator & Formatter</h1>
  <p class="sub">Build a hashtag set from your own keywords, format it for the platform, and copy it in one click.</p>

  <div class="add-row">
    <input type="text" id="tagInput" placeholder="Type a keyword and press Enter (e.g. cozy reading nook)" onkeydown="if(event.key==='Enter')addTag()">
    <button class="btn" onclick="addTag()">Add</button>
  </div>

  <div class="tag-pool" id="tagPool"></div>

  <div class="options-row">
    <label><input type="checkbox" id="lowercaseOpt" onchange="render()"> Force lowercase</label>
    <label><input type="checkbox" id="numberedOpt" onchange="render()"> Numbered list format</label>
    <select id="separatorSelect" onchange="render()">
      <option value="space">Space-separated (one line)</option>
      <option value="newline">One per line</option>
      <option value="comma">Comma-separated</option>
    </select>
  </div>

  <div class="output-box" id="outputBox">Add keywords above to generate your hashtag set.</div>
  <div class="count-hint" id="countHint"></div>

  <div class="actions">
    <button class="btn" onclick="copyOutput()">Copy hashtags</button>
    <button class="btn-ghost" onclick="clearAll()">Clear all</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'zerokit_hashtags';
let tags = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tags)); }

function toHashtag(word){
  return word.trim().replace(/[^a-zA-Z0-9]+/g,'');
}

function addTag(){
  const input = document.getElementById('tagInput');
  const raw = input.value.trim();
  if(!raw) return;
  const formatted = toHashtag(raw);
  if(formatted && !tags.includes(formatted)){
    tags.push(formatted);
    save();
  }
  input.value = '';
  render();
}

function removeTag(tag){
  tags = tags.filter(t=>t!==tag);
  save();
  render();
}

function clearAll(){
  if(confirm('Clear all hashtags?')){
    tags = [];
    save();
    render();
  }
}

function copyOutput(){
  const output = document.getElementById('outputBox').textContent;
  navigator.clipboard.writeText(output).then(()=>{
    const box = document.getElementById('outputBox');
    const original = box.textContent;
    box.textContent = 'Copied!';
    setTimeout(()=>{ box.textContent = original; }, 900);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str){
  return String(str).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function render(){
  const pool = document.getElementById('tagPool');
  if(tags.length===0){
    pool.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">No hashtags added yet.</p>';
  } else {
    pool.innerHTML = tags.map(t=>`
      <div class="tag-chip">#${escapeHtml(t)} <button onclick="removeTag('${escapeAttr(t)}')">✕</button></div>
    `).join('');
  }

  const lowercase = document.getElementById('lowercaseOpt').checked;
  const numbered = document.getElementById('numberedOpt').checked;
  const separator = document.getElementById('separatorSelect').value;

  let display = tags.map(t => lowercase ? t.toLowerCase() : t);
  let lines = display.map((t,i)=> (numbered ? `${i+1}. ` : '') + '#'+t);

  let output;
  if(separator==='space') output = lines.join(' ');
  else if(separator==='newline') output = lines.join('\n');
  else output = lines.join(', ');

  document.getElementById('outputBox').textContent = output || 'Add keywords above to generate your hashtag set.';
  document.getElementById('countHint').textContent = `${tags.length} hashtag${tags.length!==1?'s':''} · ${output.length} characters`;
}

render();
</script>
</body>
</html>
