<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Time-Blocking Planner — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
    button{cursor:pointer;font-family:inherit;}
    .btn{background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
    input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;}
    input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
    .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
    .date-picker{font-size:14px;font-weight:600;}
    .block-row{display:grid;grid-template-columns:70px 1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);}
    .block-row:last-child{border-bottom:none;}
    .block-row .hour-label{color:var(--text-dim);font-size:12px;font-variant-numeric:tabular-nums;}
    .block-row input[type="text"]{width:100%;background:transparent;border:1px solid transparent;padding:6px 8px;}
    .block-row input[type="text"]:hover,.block-row input[type="text"]:focus{background:var(--surface2);border-color:var(--border);}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
    .cat-dot{width:10px;height:10px;border-radius:50%;display:inline-block;cursor:pointer;border:1px solid var(--border);}
    .cat-picker{display:flex;gap:4px;}
    .clear-btn{background:none;border:none;color:var(--text-dim);font-size:13px;}
    .clear-btn:hover{color:var(--danger);}
    .legend{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;}
    .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">35</span>
  <span class="nav-title">Daily Time-Blocking Planner</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>Daily Time-Blocking Planner</h1>
  <p class="sub">Assign tasks to hourly blocks and color-code them by category to see your day at a glance.</p>

  <div class="top-row">
    <input type="date" id="datePicker" class="date-picker">
    <button class="btn-ghost" onclick="clearDay()">Clear this day</button>
  </div>

  <div class="card" id="blockContainer"></div>

  <div class="legend">
    <div class="legend-item"><span class="cat-dot" style="background:#c8f135"></span>Deep work</div>
    <div class="legend-item"><span class="cat-dot" style="background:#5ac8fa"></span>Meetings</div>
    <div class="legend-item"><span class="cat-dot" style="background:#ff9f5a"></span>Admin</div>
    <div class="legend-item"><span class="cat-dot" style="background:#ff5c5c"></span>Personal</div>
    <div class="legend-item"><span class="cat-dot" style="background:#2a2a2a"></span>Unassigned</div>
  </div>
</div>

<script>
const STORAGE_PREFIX = 'zerokit_timeblock_';
const CATEGORIES = ['#2a2a2a','#c8f135','#5ac8fa','#ff9f5a','#ff5c5c'];
const HOURS = Array.from({length:16}, (_,i)=>i+6); // 6am to 9pm

function todayISO(){
  return new Date().toISOString().split('T')[0];
}

function getKey(date){ return STORAGE_PREFIX + date; }

function loadDay(date){
  return JSON.parse(localStorage.getItem(getKey(date)) || '{}');
}

function saveDay(date, data){
  localStorage.setItem(getKey(date), JSON.stringify(data));
}

function formatHour(h){
  const period = h>=12 ? 'PM' : 'AM';
  let hour12 = h % 12;
  if(hour12===0) hour12 = 12;
  return `${hour12}:00 ${period}`;
}

function clearDay(){
  const date = document.getElementById('datePicker').value;
  if(confirm('Clear all blocks for this day?')){
    localStorage.removeItem(getKey(date));
    render();
  }
}

function updateTask(date, hour, value){
  const data = loadDay(date);
  data[hour] = data[hour] || {task:'', color:CATEGORIES[0]};
  data[hour].task = value;
  saveDay(date, data);
}

function cycleColor(date, hour){
  const data = loadDay(date);
  data[hour] = data[hour] || {task:'', color:CATEGORIES[0]};
  const idx = CATEGORIES.indexOf(data[hour].color);
  data[hour].color = CATEGORIES[(idx+1) % CATEGORIES.length];
  saveDay(date, data);
  render();
}

function render(){
  const date = document.getElementById('datePicker').value || todayISO();
  const data = loadDay(date);
  const container = document.getElementById('blockContainer');
  container.innerHTML = HOURS.map(h=>{
    const entry = data[h] || {task:'', color:CATEGORIES[0]};
    return `
      <div class="block-row">
        <span class="hour-label">${formatHour(h)}</span>
        <input type="text" placeholder="Add task..." value="${escapeAttr(entry.task)}" oninput="updateTask('${date}', ${h}, this.value)">
        <span class="cat-dot" style="background:${entry.color}" onclick="cycleColor('${date}', ${h})" title="Click to change category"></span>
        <span></span>
      </div>
    `;
  }).join('');
}

function escapeAttr(str){
  return String(str).replace(/"/g,'&quot;');
}

const picker = document.getElementById('datePicker');
picker.value = todayISO();
picker.addEventListener('change', render);
render();
</script>
</body>
</html>
