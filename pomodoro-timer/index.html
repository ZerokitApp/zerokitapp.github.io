<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    a{color:var(--accent);text-decoration:none;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 32px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
    button{cursor:pointer;font-family:inherit;}
    .btn{background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;}
    .btn:hover{opacity:0.9;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 18px;font-size:14px;}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
    input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;}
    input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}

    .timer-card{text-align:center;padding:48px 20px;}
    .mode-tabs{display:flex;justify-content:center;gap:8px;margin-bottom:32px;flex-wrap:wrap;}
    .mode-tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;}
    .mode-tab.active{background:var(--accent);color:#0f0f0f;border-color:var(--accent);}
    .time-display{font-size:88px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-2px;margin:8px 0 32px;}
    .ring-wrap{position:relative;width:280px;height:280px;margin:0 auto 32px;}
    svg{transform:rotate(-90deg);}
    .ring-bg{stroke:var(--surface2);}
    .ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
    .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .ring-center .time-display{margin:0;font-size:56px;}
    .ring-center .status{color:var(--text-dim);font-size:13px;text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
    .controls{display:flex;justify-content:center;gap:12px;}
    .controls button{padding:14px 28px;font-size:15px;border-radius:10px;}
    .settings-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:32px;}
    .setting{display:flex;flex-direction:column;gap:6px;align-items:center;}
    .setting label{font-size:12px;color:var(--text-dim);}
    .setting input{width:70px;text-align:center;}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px;}
    .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center;}
    .stat .num{font-size:28px;font-weight:700;color:var(--accent);}
    .stat .label{font-size:12px;color:var(--text-dim);margin-top:4px;}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">32</span>
  <span class="nav-title">Pomodoro Timer</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>Pomodoro Timer</h1>
  <p class="sub">Work in focused sprints, track completed sessions, and let the app cycle through breaks automatically.</p>

  <div class="card timer-card">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="focus" onclick="setMode('focus')">Focus</button>
      <button class="mode-tab" data-mode="short" onclick="setMode('short')">Short Break</button>
      <button class="mode-tab" data-mode="long" onclick="setMode('long')">Long Break</button>
    </div>

    <div class="ring-wrap">
      <svg width="280" height="280">
        <circle class="ring-bg" cx="140" cy="140" r="120" stroke-width="14" fill="none"/>
        <circle id="ringFg" class="ring-fg" cx="140" cy="140" r="120" stroke-width="14" fill="none"/>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="status" id="statusLabel">Ready to focus</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn-ghost" onclick="resetTimer()">Reset</button>
      <button class="btn-ghost" onclick="skipTimer()">Skip</button>
    </div>

    <div class="settings-row">
      <div class="setting">
        <label>Focus (min)</label>
        <input type="number" id="focusLen" value="25" min="1" max="120" onchange="saveSettings()">
      </div>
      <div class="setting">
        <label>Short break</label>
        <input type="number" id="shortLen" value="5" min="1" max="60" onchange="saveSettings()">
      </div>
      <div class="setting">
        <label>Long break</label>
        <input type="number" id="longLen" value="15" min="1" max="60" onchange="saveSettings()">
      </div>
      <div class="setting">
        <label>Sessions/cycle</label>
        <input type="number" id="cycleLen" value="4" min="1" max="10" onchange="saveSettings()">
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statToday">0</div><div class="label">Sessions today</div></div>
    <div class="stat"><div class="num" id="statStreak">0</div><div class="label">Current streak</div></div>
    <div class="stat"><div class="num" id="statTotal">0</div><div class="label">Total sessions</div></div>
  </div>
</div>

<audio id="dingSound" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQ==" type="audio/wav">
</audio>

<script>
const STORAGE_KEY = 'zerokit_pomodoro';
let settings = { focus:25, short:5, long:15, cycle:4 };
let state = { mode:'focus', secondsLeft:25*60, running:false, sessionCount:0, completedToday:0, streak:0, totalSessions:0, lastDate:null };
let intervalId = null;

function loadState(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      const parsed = JSON.parse(saved);
      settings = parsed.settings || settings;
      state.completedToday = parsed.completedToday || 0;
      state.streak = parsed.streak || 0;
      state.totalSessions = parsed.totalSessions || 0;
      state.lastDate = parsed.lastDate || null;
      const today = new Date().toDateString();
      if(state.lastDate !== today){
        state.completedToday = 0;
      }
    }catch(e){}
  }
  document.getElementById('focusLen').value = settings.focus;
  document.getElementById('shortLen').value = settings.short;
  document.getElementById('longLen').value = settings.long;
  document.getElementById('cycleLen').value = settings.cycle;
  state.secondsLeft = settings.focus*60;
  updateStatsDisplay();
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    settings, completedToday: state.completedToday, streak: state.streak,
    totalSessions: state.totalSessions, lastDate: new Date().toDateString()
  }));
}

function saveSettings(){
  settings.focus = parseInt(document.getElementById('focusLen').value)||25;
  settings.short = parseInt(document.getElementById('shortLen').value)||5;
  settings.long = parseInt(document.getElementById('longLen').value)||15;
  settings.cycle = parseInt(document.getElementById('cycleLen').value)||4;
  if(!state.running) resetTimer();
  saveState();
}

function updateStatsDisplay(){
  document.getElementById('statToday').textContent = state.completedToday;
  document.getElementById('statStreak').textContent = state.streak;
  document.getElementById('statTotal').textContent = state.totalSessions;
}

function setMode(mode){
  state.mode = mode;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('active', t.dataset.mode===mode));
  const lens = {focus:settings.focus, short:settings.short, long:settings.long};
  state.secondsLeft = lens[mode]*60;
  pauseTimer();
  renderTime();
}

function renderTime(){
  const m = Math.floor(state.secondsLeft/60).toString().padStart(2,'0');
  const s = (state.secondsLeft%60).toString().padStart(2,'0');
  document.getElementById('timeDisplay').textContent = `${m}:${s}`;
  const labels = {focus:'Focusing', short:'Short break', long:'Long break'};
  document.getElementById('statusLabel').textContent = state.running ? labels[state.mode] : 'Paused';
  const totalLens = {focus:settings.focus, short:settings.short, long:settings.long};
  const total = totalLens[state.mode]*60;
  const circumference = 2*Math.PI*120;
  const progress = 1 - (state.secondsLeft/total);
  const ring = document.getElementById('ringFg');
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = circumference*(1-progress);
}

function toggleTimer(){
  if(state.running){ pauseTimer(); } else { startTimer(); }
}

function startTimer(){
  state.running = true;
  document.getElementById('startBtn').textContent = 'Pause';
  document.getElementById('statusLabel').textContent = {focus:'Focusing', short:'Short break', long:'Long break'}[state.mode];
  intervalId = setInterval(()=>{
    state.secondsLeft--;
    if(state.secondsLeft<=0){
      completeSession();
    }
    renderTime();
  },1000);
}

function pauseTimer(){
  state.running = false;
  clearInterval(intervalId);
  document.getElementById('startBtn').textContent = 'Start';
  renderTime();
}

function resetTimer(){
  pauseTimer();
  const lens = {focus:settings.focus, short:settings.short, long:settings.long};
  state.secondsLeft = lens[state.mode]*60;
  renderTime();
}

function completeSession(){
  pauseTimer();
  try{ document.getElementById('dingSound').play().catch(()=>{}); }catch(e){}
  if(state.mode==='focus'){
    state.sessionCount++;
    state.completedToday++;
    state.totalSessions++;
    state.streak++;
    saveState();
    updateStatsDisplay();
    if(state.sessionCount % settings.cycle === 0){
      setMode('long');
    } else {
      setMode('short');
    }
  } else {
    setMode('focus');
  }
}

function skipTimer(){
  if(state.mode==='focus'){
    completeSession();
  } else {
    setMode('focus');
  }
}

loadState();
renderTime();
</script>
</body>
</html>
