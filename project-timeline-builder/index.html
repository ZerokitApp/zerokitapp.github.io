<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Timeline Builder — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
    button{cursor:pointer;font-family:inherit;}
    .btn{background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
    input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:13px;}
    input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
    .add-row{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;align-items:center;}
    .add-row input[type="text"]{flex:1;min-width:160px;}
    .chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;overflow-x:auto;}
    .task-row{display:grid;grid-template-columns:180px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
    .task-row:last-child{border-bottom:none;}
    .task-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .bar-track{position:relative;height:26px;background:var(--surface2);border-radius:6px;min-width:400px;}
    .bar-fill{position:absolute;top:0;height:100%;border-radius:6px;background:var(--accent);display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#0f0f0f;white-space:nowrap;overflow:hidden;}
    .task-row button{background:none;border:none;color:var(--text-dim);font-size:14px;}
    .task-row button:hover{color:var(--danger);}
    .axis{display:grid;grid-template-columns:180px 1fr auto;gap:14px;margin-bottom:8px;}
    .axis-labels{position:relative;height:16px;min-width:400px;font-size:10px;color:var(--text-dim);}
    .axis-labels span{position:absolute;transform:translateX(-50%);}
    .empty-state{text-align:center;color:var(--text-dim);padding:40px 0;font-size:14px;}
    .color-dot{width:14px;height:14px;border-radius:4px;cursor:pointer;border:1px solid var(--border);}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">39</span>
  <span class="nav-title">Project Timeline Builder</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>Project Timeline Builder</h1>
  <p class="sub">A simple Gantt-style view. Add tasks with start and end dates to see overlaps and duration at a glance.</p>

  <div class="add-row">
    <input type="text" id="taskInput" placeholder="Task name...">
    <input type="date" id="startInput">
    <input type="date" id="endInput">
    <button class="btn" onclick="addTask()">Add task</button>
  </div>

  <div class="chart-wrap">
    <div id="axisRow"></div>
    <div id="taskList"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'zerokit_timeline';
const COLORS = ['#c8f135','#5ac8fa','#ff9f5a','#ff5c5c','#b892ff'];
let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

function addTask(){
  const name = document.getElementById('taskInput').value.trim();
  const start = document.getElementById('startInput').value;
  const end = document.getElementById('endInput').value;
  if(!name || !start || !end){ alert('Please fill in task name, start date, and end date.'); return; }
  if(new Date(end) < new Date(start)){ alert('End date must be after start date.'); return; }
  const color = COLORS[tasks.length % COLORS.length];
  tasks.push({ id: Date.now(), name, start, end, color });
  document.getElementById('taskInput').value='';
  document.getElementById('startInput').value='';
  document.getElementById('endInput').value='';
  save();
  render();
}

function removeTask(id){
  tasks = tasks.filter(t=>t.id!==id);
  save();
  render();
}

function render(){
  const taskListEl = document.getElementById('taskList');
  const axisEl = document.getElementById('axisRow');

  if(tasks.length===0){
    taskListEl.innerHTML = '<div class="empty-state">No tasks yet. Add one above to build your timeline.</div>';
    axisEl.innerHTML = '';
    return;
  }

  const allDates = tasks.flatMap(t=>[new Date(t.start), new Date(t.end)]);
  const minDate = new Date(Math.min(...allDates));
  const maxDate = new Date(Math.max(...allDates));
  const totalSpan = Math.max(1, (maxDate - minDate) / 86400000);

  // Axis with ~5 markers
  const markerCount = 5;
  let axisHtml = '<div class="axis"><div></div><div class="axis-labels">';
  for(let i=0;i<=markerCount;i++){
    const d = new Date(minDate.getTime() + (totalSpan*i/markerCount)*86400000);
    const pct = (i/markerCount)*100;
    axisHtml += `<span style="left:${pct}%">${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>`;
  }
  axisHtml += '</div><div></div></div>';
  axisEl.innerHTML = axisHtml;

  taskListEl.innerHTML = tasks.map(t=>{
    const s = new Date(t.start), e = new Date(t.end);
    const offsetPct = ((s - minDate)/86400000 / totalSpan)*100;
    const widthPct = Math.max(2, ((e - s)/86400000 + 1) / totalSpan * 100);
    const days = Math.round((e-s)/86400000)+1;
    return `
      <div class="task-row">
        <div class="task-label" title="${escapeAttr(t.name)}">${escapeHtml(t.name)}</div>
        <div class="bar-track">
          <div class="bar-fill" style="left:${offsetPct}%;width:${widthPct}%;background:${t.color}">${days}d</div>
        </div>
        <button onclick="removeTask(${t.id})">✕</button>
      </div>
    `;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str){
  return String(str).replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
