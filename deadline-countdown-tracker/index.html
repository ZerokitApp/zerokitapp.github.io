<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadline Countdown Tracker — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:900px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
    button{cursor:pointer;font-family:inherit;}
    .btn{background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;}
    input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;}
    input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
    .add-row{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;}
    .add-row input[type="text"]{flex:1;min-width:160px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
    .deadline-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;}
    .deadline-card.urgent{border-color:var(--danger);}
    .deadline-card.soon{border-color:#ffc14a;}
    .deadline-card .title{font-weight:700;font-size:15px;margin-bottom:4px;padding-right:20px;}
    .deadline-card .date{font-size:12px;color:var(--text-dim);margin-bottom:16px;}
    .countdown{font-size:32px;font-weight:800;color:var(--accent);}
    .deadline-card.urgent .countdown{color:var(--danger);}
    .deadline-card.soon .countdown{color:#ffc14a;}
    .countdown-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;}
    .remove-btn{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-dim);font-size:14px;}
    .remove-btn:hover{color:var(--danger);}
    .empty-state{text-align:center;color:var(--text-dim);padding:60px 0;font-size:14px;grid-column:1/-1;}
    .past-tag{display:inline-block;font-size:10px;background:var(--surface2);color:var(--text-dim);padding:2px 8px;border-radius:10px;margin-top:8px;}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">43</span>
  <span class="nav-title">Deadline Countdown Tracker</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>Deadline Countdown Tracker</h1>
  <p class="sub">Track upcoming deadlines with a live countdown. Cards turn amber inside a week, red inside 48 hours.</p>

  <div class="add-row">
    <input type="text" id="titleInput" placeholder="Deadline name (e.g. Submit FameSwap listing)">
    <input type="datetime-local" id="dateInput">
    <button class="btn" onclick="addDeadline()">Add</button>
  </div>

  <div class="grid" id="deadlineGrid"></div>
</div>

<script>
const STORAGE_KEY = 'zerokit_deadlines';
let deadlines = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(deadlines)); }

function addDeadline(){
  const title = document.getElementById('titleInput').value.trim();
  const date = document.getElementById('dateInput').value;
  if(!title || !date){ alert('Please add a name and a date/time.'); return; }
  deadlines.push({ id: Date.now(), title, date });
  document.getElementById('titleInput').value = '';
  document.getElementById('dateInput').value = '';
  save();
  render();
}

function removeDeadline(id){
  deadlines = deadlines.filter(d=>d.id!==id);
  save();
  render();
}

function formatCountdown(ms){
  if(ms<=0) return { text:'Past due', label:'', past:true };
  const totalSeconds = Math.floor(ms/1000);
  const days = Math.floor(totalSeconds/86400);
  const hours = Math.floor((totalSeconds%86400)/3600);
  const minutes = Math.floor((totalSeconds%3600)/60);
  if(days>0) return { text:`${days}d ${hours}h`, label:'remaining' };
  if(hours>0) return { text:`${hours}h ${minutes}m`, label:'remaining' };
  return { text:`${minutes}m`, label:'remaining' };
}

function render(){
  const container = document.getElementById('deadlineGrid');
  if(deadlines.length===0){
    container.innerHTML = '<div class="empty-state">No deadlines tracked yet. Add one above.</div>';
    return;
  }

  const sorted = deadlines.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));

  container.innerHTML = sorted.map(d=>{
    const target = new Date(d.date);
    const diff = target - new Date();
    const cd = formatCountdown(diff);
    const hoursLeft = diff/3600000;
    let cls = '';
    if(!cd.past){
      if(hoursLeft<48) cls='urgent';
      else if(hoursLeft<168) cls='soon';
    }
    const dateStr = target.toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
    return `
      <div class="deadline-card ${cls}">
        <button class="remove-btn" onclick="removeDeadline(${d.id})">✕</button>
        <div class="title">${escapeHtml(d.title)}</div>
        <div class="date">${dateStr}</div>
        ${cd.past
          ? `<span class="past-tag">Past due</span>`
          : `<div class="countdown">${cd.text}</div><div class="countdown-label">${cd.label}</div>`
        }
      </div>
    `;
  }).join('');
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
