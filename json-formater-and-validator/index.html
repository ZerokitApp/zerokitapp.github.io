<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter & Validator — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 24px;}
    button{cursor:pointer;font-family:inherit;}
    .btn{background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
    .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
    .panes{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .pane{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
    .pane-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
    textarea{width:100%;height:460px;background:transparent;border:none;color:var(--text);font-family:'SF Mono',Consolas,monospace;font-size:13px;padding:16px;resize:vertical;}
    textarea:focus{outline:none;}
    #output{white-space:pre-wrap;word-break:break-word;}
    .status-bar{margin-top:14px;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;}
    .status-bar.valid{background:rgba(200,241,53,0.1);color:var(--accent);border:1px solid rgba(200,241,53,0.3);}
    .status-bar.invalid{background:rgba(255,92,92,0.1);color:#ff8787;border:1px solid rgba(255,92,92,0.3);}
    @media(max-width:800px){.panes{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">48</span>
  <span class="nav-title">JSON Formatter & Validator</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>JSON Formatter & Validator</h1>
  <p class="sub">Paste JSON to validate it and get a clean, indented version. All processing happens in your browser.</p>

  <div class="toolbar">
    <button class="btn" onclick="formatJson()">Format & validate</button>
    <button class="btn-ghost" onclick="minifyJson()">Minify</button>
    <button class="btn-ghost" onclick="copyOutput()">Copy output</button>
    <button class="btn-ghost" onclick="clearAll()">Clear</button>
  </div>

  <div class="panes">
    <div class="pane">
      <div class="pane-header">Input</div>
      <textarea id="inputArea" placeholder='{"example": "paste your JSON here"}'></textarea>
    </div>
    <div class="pane">
      <div class="pane-header">Output</div>
      <div id="output" style="padding:16px;font-family:monospace;font-size:13px;height:460px;overflow:auto;"></div>
    </div>
  </div>

  <div class="status-bar" id="statusBar" style="display:none;"></div>
</div>

<script>
function formatJson(){
  const input = document.getElementById('inputArea').value;
  const output = document.getElementById('output');
  const status = document.getElementById('statusBar');
  try{
    const parsed = JSON.parse(input);
    const formatted = JSON.stringify(parsed, null, 2);
    output.textContent = formatted;
    status.style.display = 'block';
    status.className = 'status-bar valid';
    status.textContent = '✓ Valid JSON';
  }catch(e){
    output.textContent = '';
    status.style.display = 'block';
    status.className = 'status-bar invalid';
    status.textContent = '✕ Invalid JSON — ' + e.message;
  }
}

function minifyJson(){
  const input = document.getElementById('inputArea').value;
  const output = document.getElementById('output');
  const status = document.getElementById('statusBar');
  try{
    const parsed = JSON.parse(input);
    output.textContent = JSON.stringify(parsed);
    status.style.display = 'block';
    status.className = 'status-bar valid';
    status.textContent = '✓ Valid JSON — minified';
  }catch(e){
    output.textContent = '';
    status.style.display = 'block';
    status.className = 'status-bar invalid';
    status.textContent = '✕ Invalid JSON — ' + e.message;
  }
}

function copyOutput(){
  const text = document.getElementById('output').textContent;
  if(!text) return;
  navigator.clipboard.writeText(text);
}

function clearAll(){
  document.getElementById('inputArea').value = '';
  document.getElementById('output').textContent = '';
  document.getElementById('statusBar').style.display = 'none';
}
</script>
</body>
</html>
