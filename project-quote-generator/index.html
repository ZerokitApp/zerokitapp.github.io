:root {
  --bg:#f5f2eb;

  --shadow-lg:0 4px 24px rgba(26,24,20,0.12);
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  font-family:'Outfit',sans-serif;
  overflow-x:hidden;
}

/* FIX 1: LAYOUT SCROLL SAFE */
.layout{
  max-width:960px;
  margin:0 auto;
  padding:28px 24px 80px;
  display:grid;
  grid-template-columns:1fr 400px;
  gap:20px;
  align-items:start;
}

/* FIX 2: PREVIEW SCROLL FIX (THIS IS YOUR MAIN BUG) */
.quote-preview-wrap{
  position:sticky;
  top:74px;
  max-height:calc(100vh - 90px);
  overflow-y:auto;
}

/* FIX 3: MOBILE FIX (NO STICKY ON SMALL SCREENS) */
@media(max-width:800px){
  .layout{grid-template-columns:1fr;}
  .quote-preview-wrap{
    position:relative;
    top:auto;
    max-height:none;
    overflow:visible;
  }
}

/* keep rest of your styling unchanged */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;}
.card-body{padding:22px;}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;}

.quote-doc{background:white;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);}

/* (KEEP ALL YOUR OTHER CSS AS-IS — REMOVED HERE FOR BREVITY) */
</style>
