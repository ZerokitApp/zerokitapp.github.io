<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Quote Generator — ZeroKit</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg:#f5f2eb;
  --bg2:#eeeadf;
  --white:#fdfcf9;
  --ink:#1a1814;
  --ink2:#3d3a34;
  --ink3:#7a7570;
  --ink4:#b5b0a8;
  --border:#ddd9d0;
  --border2:#ccc8bf;
  --accent:#1a4a8a;
  --red:#8a2a1a;
  --green:#1a6a3a;
  --radius:12px;
  --radius-sm:7px;
  --shadow:0 1px 4px rgba(0,0,0,0.08);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg);color:var(--ink)}

/* layout simplified (same design preserved) */
.layout{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:1fr 420px;gap:20px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

/* cards */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.card-header{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.card-body{padding:16px}

input,textarea,select{
  width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;
}

/* scope */
.scope-item{display:grid;grid-template-columns:1fr 70px 90px 90px 40px;gap:6px;margin-bottom:6px}
.scope-total{font-family:monospace;background:var(--bg2);display:flex;align-items:center;justify-content:flex-end;padding:8px;border-radius:6px}

/* preview */
.quote-doc{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.q-header{background:#111;color:white;padding:20px}
.q-body{padding:20px}

/* buttons */
.btn{padding:10px 12px;border:0;border-radius:6px;cursor:pointer}
.btn-primary{background:#111;color:white}
.btn-secondary{background:transparent;border:1px solid var(--border)}

/* totals */
.totals-card{background:white;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.totals-inner{padding:14px}
.totals-row{display:flex;justify-content:space-between;padding:6px 0}
.totals-grand{background:#111;color:white;padding:12px 14px;display:flex;justify-content:space-between}
</style>
</head>

<body>

<div class="layout">

<!-- FORM -->
<div>

<div class="card">
<div class="card-header"><b>Client</b></div>
<div class="card-body">
<input id="fromName" placeholder="Your name" oninput="update()">
<input id="fromEmail" placeholder="Your email" oninput="update()">
<input id="toName" placeholder="Client name" oninput="update()">
</div>
</div>

<div class="card">
<div class="card-header"><b>Scope</b></div>
<div class="card-body">

<div id="scopeContainer"></div>

<button class="btn btn-secondary" onclick="addScope()">Add</button>

</div>
</div>

</div>

<!-- PREVIEW -->
<div>

<div class="totals-card">
<div class="totals-inner">
<div class="totals-row"><span>Subtotal</span><span id="tSubtotal">$0</span></div>
<div class="totals-row"><span>Hours</span><span id="tHours">0</span></div>
</div>
<div class="totals-grand">
<span>Total</span>
<span id="tGrand">$0</span>
</div>
</div>

<div id="quoteDoc" class="quote-doc">

<div class="q-header">
<h2 id="qBrand">Your Business</h2>
</div>

<div class="q-body">
<table width="100%">
<tbody id="qTable"></tbody>
</table>
</div>

</div>

<div style="margin-top:10px;display:flex;gap:6px">
<button class="btn btn-primary" onclick="downloadPDF()">Download PDF</button>
<button class="btn btn-secondary" onclick="printQuote()">Print</button>
</div>

</div>
</div>

<script>

let scopeItems = [{desc:'',hours:0,rate:0}];

function addScope(){
  scopeItems.push({desc:'',hours:0,rate:0});
  renderScope();
}

function renderScope(){
  const c=document.getElementById("scopeContainer");
  c.innerHTML="";
  scopeItems.forEach((it,i)=>{
    const div=document.createElement("div");
    div.className="scope-item";
    div.innerHTML=`
      <input placeholder="Work" value="${it.desc}" oninput="scopeItems[${i}].desc=this.value;update()">
      <input type="number" value="${it.hours}" oninput="scopeItems[${i}].hours=this.value;update()">
      <input type="number" value="${it.rate}" oninput="scopeItems[${i}].rate=this.value;update()">
      <div class="scope-total">$0</div>
      <button onclick="removeScope(${i})">x</button>
    `;
    c.appendChild(div);
  });
}

function removeScope(i){
  scopeItems.splice(i,1);
  if(scopeItems.length===0) scopeItems=[{desc:'',hours:0,rate:0}];
  renderScope();
  update();
}

function calc(){
  let sub=0,h=0;
  scopeItems.forEach(it=>{
    sub += (it.hours||0)*(it.rate||0);
    h += Number(it.hours||0);
  });
  return {sub,h};
}

function update(){
  const c=calc();

  document.getElementById("tSubtotal").innerText="$"+c.sub.toFixed(2);
  document.getElementById("tHours").innerText=c.h;

  document.getElementById("tGrand").innerText="$"+c.sub.toFixed(2);

  const t=document.getElementById("qTable");
  t.innerHTML="";

  scopeItems.forEach(it=>{
    const total=(it.hours||0)*(it.rate||0);
    t.innerHTML+=`
      <tr>
        <td>${it.desc||"—"}</td>
        <td>${it.hours||0}</td>
        <td>$${it.rate||0}</td>
        <td>$${total.toFixed(2)}</td>
      </tr>
    `;
  });
}

function printQuote(){
  window.print();
}

/* ✅ FIXED PDF EXPORT (THIS WAS YOUR MAIN BUG) */
function downloadPDF(){

  const doc=document.getElementById("quoteDoc").outerHTML;

  const win=window.open("","_blank");
  win.document.write(`
  <html>
  <head>
  <title>Quote</title>
  <style>
  body{font-family:Arial;padding:20px}
  table{width:100%;border-collapse:collapse}
  td,th{border-bottom:1px solid #ddd;padding:8px}
  </style>
  </head>
  <body>
  ${doc}
  <script>
  window.onload=function(){
    window.print();
    window.onafterprint=()=>window.close();
  }
  <\/script>
  </body>
  </html>
  `);

  win.document.close();
}

renderScope();
update();

</script>

</body>
</html>
