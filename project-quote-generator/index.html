<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Quote Generator — ZeroKit</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
:root{
  --bg:#f5f2eb;
  --white:#fdfcf9;
  --ink:#1a1814;
  --ink2:#3d3a34;
  --ink3:#7a7570;
  --border:#ddd9d0;
  --accent:#1a4a8a;
  --radius:12px;
  --shadow:0 1px 4px rgba(0,0,0,0.08),0 4px 16px rgba(0,0,0,0.06);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Outfit,sans-serif;
  background:var(--bg);
}

.layout{
  max-width:1100px;
  margin:0 auto;
  padding:24px;
  display:grid;
  grid-template-columns:1fr 420px;
  gap:20px;
}

/* LEFT FORM */
.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:14px;
}

input,textarea,select{
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:8px;
  margin-top:6px;
}

label{
  font-size:12px;
  color:var(--ink3);
}

/* RIGHT PREVIEW */
.preview{
  position:sticky;
  top:20px;
}

.quote{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.header{
  background:var(--ink);
  color:white;
  padding:18px;
}

.body{
  padding:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #eee;
}

.total{
  font-weight:bold;
  font-size:18px;
  color:var(--accent);
  text-align:right;
  padding-top:10px;
}

/* BUTTONS */
button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn{
  background:var(--ink);
  color:white;
}

.btn2{
  background:transparent;
  border:1px solid var(--border);
}

/* PRINT FIX */
@media print{
  body{background:white;}
  .layout{display:block;}
  .preview{position:static;}
}
</style>
</head>

<body>

<div class="layout">

  <!-- LEFT SIDE -->
  <div>

    <div class="card">
      <label>Your Name</label>
      <input id="fromName" oninput="update()" placeholder="Your business"/>

      <label>Your Email</label>
      <input id="fromEmail" oninput="update()" placeholder="email"/>

      <label>Client Name</label>
      <input id="toName" oninput="update()" placeholder="client"/>

      <label>Project Title</label>
      <input id="project" oninput="update()" placeholder="Website Design"/>

      <label>Hours</label>
      <input id="hours" type="number" value="10" oninput="update()"/>

      <label>Rate</label>
      <input id="rate" type="number" value="50" oninput="update()"/>

      <label>Discount %</label>
      <input id="discount" type="number" value="0" oninput="update()"/>

      <label>Tax %</label>
      <input id="tax" type="number" value="0" oninput="update()"/>
    </div>

  </div>

  <!-- RIGHT SIDE -->
  <div class="preview">

    <div class="quote" id="quoteDoc">

      <div class="header">
        <h2 id="qTitle">Quote</h2>
        <small id="qMeta"></small>
      </div>

      <div class="body">

        <div class="row">
          <span>Client</span>
          <span id="qClient">-</span>
        </div>

        <div class="row">
          <span>Project</span>
          <span id="qProject">-</span>
        </div>

        <div class="row">
          <span>Hours</span>
          <span id="qHours">0</span>
        </div>

        <div class="row">
          <span>Rate</span>
          <span id="qRate">$0</span>
        </div>

        <div class="row">
          <span>Subtotal</span>
          <span id="qSubtotal">$0</span>
        </div>

        <div class="row">
          <span>Discount</span>
          <span id="qDiscount">$0</span>
        </div>

        <div class="row">
          <span>Tax</span>
          <span id="qTax">$0</span>
        </div>

        <div class="total">
          Total: <span id="qTotal">$0</span>
        </div>

      </div>
    </div>

    <button class="btn" onclick="downloadPDF()">Download PDF</button>
    <button class="btn2" onclick="window.print()">Print</button>

  </div>
</div>

<script>

function v(id){
  return parseFloat(document.getElementById(id).value)||0;
}

function s(id){
  return document.getElementById(id).value||'';
}

function fmt(n){
  return "$" + n.toFixed(2);
}

function update(){

  const hours = v('hours');
  const rate = v('rate');
  const discount = v('discount');
  const tax = v('tax');

  const subtotal = hours * rate;
  const disc = subtotal * (discount/100);
  const after = subtotal - disc;
  const taxAmt = after * (tax/100);
  const total = after + taxAmt;

  document.getElementById('qClient').innerText = s('toName') || '-';
  document.getElementById('qProject').innerText = s('project') || '-';

  document.getElementById('qHours').innerText = hours;
  document.getElementById('qRate').innerText = fmt(rate);

  document.getElementById('qSubtotal').innerText = fmt(subtotal);
  document.getElementById('qDiscount').innerText = "-"+fmt(disc);
  document.getElementById('qTax').innerText = fmt(taxAmt);
  document.getElementById('qTotal').innerText = fmt(total);

}

update();

/* PDF FIX */
function downloadPDF(){

  const html = document.getElementById('quoteDoc').outerHTML;

  const win = window.open('', '_blank');
  if(!win) return alert("Enable popups");

  win.document.write(`
<!DOCTYPE html>
<html>
<head>
<title>Quote</title>
<style>
body{font-family:Arial;padding:20px;}
</style>
</head>
<body>
${html}
<script>
window.onload=()=>window.print();
<\/script>
</body>
</html>
  `);

  win.document.close();
}

</script>

</body>
</html>

const blob = new Blob([html], {type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const w    = window.open(url, '_blank');
  if (!w) alert('Allow popups to download PDF, then use Save as PDF.');
}
</script>
</body>
</html>
