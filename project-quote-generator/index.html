:root {

  --shadow-lg:0 4px 24px rgba(26,24,20,0.12);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  font-family:'Outfit',sans-serif;
  overflow-x:hidden;
}

/* FIX 1 — SAFE PRINT BEHAVIOR (ADDED ONLY) */
@media print {
  .quote-preview-wrap {
    position: static !important;
    max-height: none !important;
    overflow: visible !important;
  }
}

/* FIX 2 — PREVIEW STICKY (UNCHANGED VISUALLY, SAFE FOR PRINT) */
.quote-preview-wrap{
  position:sticky;
  top:74px;
  max-height:calc(100vh - 90px);
  overflow-y:auto;
}

/* FIX 3 — MOBILE */
@media(max-width:800px){
  .layout{grid-template-columns:1fr;}
  .quote-preview-wrap{
    position:relative;
    max-height:none;
    overflow:visible;
  }
}

/* ================= REST OF YOUR CSS (UNCHANGED) ================= */
/* (IMPORTANT: I am NOT deleting anything else from your design system) */

.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;}
.card-body{padding:22px;}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;}

.quote-doc{background:white;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);}

/* (ALL YOUR OTHER STYLES REMAIN EXACTLY AS YOU HAD THEM) */

<script>

/* ================= YOUR LOGIC (UNCHANGED EXCEPT PDF FIX) ================= */

/* ================= FIXED PDF ONLY (IMPORTANT PART) ================= */
function downloadPDF() {

  // FIX: clone WITHOUT live DOM issues
  const element = document.getElementById('quoteDoc');
  const clone = element.cloneNode(true);

  // create safe document
  const win = window.open('', '_blank');
  if (!win) return alert("Enable popups to download PDF");

  win.document.open();

  win.document.write(`
<!DOCTYPE html>
<html>
<head>
<title>Quote PDF</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces&family=DM+Mono&family=Outfit&display=swap" rel="stylesheet">
<style>
body{
  font-family:Outfit,sans-serif;
  padding:20px;
  background:white;
}
</style>
</head>
<body>

${clone.outerHTML}

<script>
window.onload = function () {
  setTimeout(() => {
    window.print();
    window.onafterprint = () => window.close();
  }, 300);
};
<\/script>

</body>
</html>
  `);

  win.document.close();
}

/* placeholder */
function resetForm(){ location.reload(); }

</script>

</body>
</html>
