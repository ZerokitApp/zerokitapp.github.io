<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Quote Generator — ZeroKit</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg:#f5f2eb;
  --bg2:#eeeadf;
  --white:#fdfcf9;
  --ink:#1a1814;
  --ink2:#3d3a34;
  --ink3:#7a7570;
  --ink4:#b5b0a8;
  --border:#ddd9d0;
  --border2:#ccc8bf;
  --accent:#1a4a8a;
  --accent-bg:rgba(26,74,138,0.06);
  --red:#8a2a1a;
  --green:#1a6a3a;
  --radius:12px;
  --radius-sm:7px;
  --shadow:0 1px 4px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 30px rgba(0,0,0,0.12);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Outfit',sans-serif;
  overflow-x:hidden;
}

/* FIX: removed z-index overlay bug */
body::before{
  content:'';
  position:fixed;
  inset:0;
  opacity:0.03;
  pointer-events:none;
  z-index:0;
}

/* NAV */
.nav{
  background:var(--white);
  border-bottom:2px solid var(--ink);
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:10;
}

/* HERO */
.hero-strip{
  background:var(--ink);
  color:white;
  padding:40px 24px;
}

/* LAYOUT FIX */
.layout{
  max-width:1000px;
  margin:0 auto;
  padding:30px 20px 80px;
  display:grid;
  grid-template-columns:1fr 420px;
  gap:20px;
  align-items:start;
}

/* ✅ FIXED: removed sticky bug */
.quote-preview-wrap{
  position:relative;
  top:auto;
}

/* MOBILE FIX */
@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }

  .quote-preview-wrap{
    position:relative;
  }
}

/* CARDS */
.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.card-header{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
}

.card-body{
  padding:18px;
}

/* INPUTS */
input,textarea,select{
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:6px;
  font-family:inherit;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:var(--accent);
}

/* SCROLL AREA FIX */
#scopeContainer{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.scope-item{
  display:grid;
  grid-template-columns:1fr 80px 80px 80px 40px;
  gap:8px;
  align-items:center;
}

.scope-total{
  font-family:'DM Mono',monospace;
  text-align:right;
}

/* BUTTON */
button{
  cursor:pointer;
}

/* PREVIEW FIX */
.quote-doc{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
}

/* IMPORTANT PDF SAFETY */
@media print {
  body {
    background:white !important;
  }
}
</style>
</head>

<body>

<nav class="nav">
  <div><strong>ZeroKit</strong></div>
</nav>

<div class="hero-strip">
  <h1>Quote Generator</h1>
</div>

<div class="layout">

<!-- LEFT -->
<div>

  <div class="card">
    <div class="card-header">Client Info</div>
    <div class="card-body">
      <input id="fromName" placeholder="Your Name" oninput="update()">
      <input id="toName" placeholder="Client Name" oninput="update()">
    </div>
  </div>

  <div class="card">
    <div class="card-header">Scope</div>
    <div class="card-body">

      <div id="scopeContainer"></div>

      <button onclick="addScope()">+ Add</button>

    </div>
  </div>

</div>

<!-- RIGHT -->
<div class="quote-preview-wrap">

  <div class="quote-doc" id="quoteDoc">
    <div style="padding:20px">
      <h3 id="qFrom">Your Business</h3>
      <h4 id="qTo">Client</h4>

      <table width="100%">
        <tbody id="qTable"></tbody>
      </table>

      <h2 id="total">$0</h2>
    </div>
  </div>

  <button onclick="downloadPDF()">Download PDF</button>

</div>

</div>

<script>

let scopeItems = [{desc:"",hours:0,rate:0}];

function addScope(){
  scopeItems.push({desc:"",hours:0,rate:0});
  render();
}

function render(){

  let c = document.getElementById("scopeContainer");
  c.innerHTML="";

  scopeItems.forEach((s,i)=>{
    let div = document.createElement("div");
    div.className="scope-item";

    div.innerHTML=`
      <input placeholder="Task" oninput="scopeItems[${i}].desc=this.value;update()">
      <input type="number" oninput="scopeItems[${i}].hours=this.value;update()">
      <input type="number" oninput="scopeItems[${i}].rate=this.value;update()">
      <div class="scope-total">$0</div>
      <button onclick="scopeItems.splice(${i},1);render();update()">X</button>
    `;

    c.appendChild(div);
  });

  update();
}

function update(){

  let total=0;

  let table="";

  scopeItems.forEach(s=>{
    let t=(s.hours||0)*(s.rate||0);
    total+=t;

    table+=`<tr>
      <td>${s.desc||""}</td>
      <td>${t}</td>
    </tr>`;
  });

  document.getElementById("qTable").innerHTML=table;
  document.getElementById("total").innerText="$"+total.toFixed(2);

  document.getElementById("qFrom").innerText=
    document.getElementById("fromName").value || "Your Business";

  document.getElementById("qTo").innerText=
    document.getElementById("toName").value || "Client";
}

/* ✅ FIXED PDF (no blank page) */
function downloadPDF(){

  const content=document.getElementById("quoteDoc").outerHTML;

  const w=window.open();

  w.document.write(`
    <html>
    <head>
      <title>Quote</title>
      <style>
        body{font-family:Arial;padding:20px;}
      </style>
    </head>
    <body>
      ${content}
      <script>
        setTimeout(()=>{
          window.print();
        },800);
      <\/script>
    </body>
    </html>
  `);

  w.document.close();
}

render();

</script>

</body>
</html>

const blob = new Blob([html], {type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const w    = window.open(url, '_blank');
  if (!w) alert('Allow popups to download PDF, then use Save as PDF.');
}
</script>
</body>
</html>
