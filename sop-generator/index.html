<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SOP Generator — ZeroKit</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2a2a2a;--border2:#333;--text:#f0f0f0;--muted:#888;--accent:#c8f135;--accent-dk:#a8cc1a;--danger:#ff5c5c;--radius:10px;--font:'Inter',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(15,15,15,.92);backdrop-filter:blur(8px);z-index:100}
.nav-logo{font-weight:700;font-size:15px;color:var(--text);text-decoration:none}
.nav-logo span{color:var(--accent)}
.nav-tag{font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border2);padding:3px 10px;border-radius:20px}
.hero{max-width:900px;margin:0 auto;padding:56px 24px 32px}
.hero-eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.hero h1{font-size:clamp(28px,5vw,40px);font-weight:800;line-height:1.15;letter-spacing:-.03em;margin-bottom:14px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p{color:var(--muted);font-size:15px;max-width:520px}
.layout{max-width:900px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:720px){.layout{grid-template-columns:1fr}}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:var(--font);font-size:13px;padding:9px 12px;outline:none;transition:border-color .15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* steps */
.step-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.step-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.step-num{background:var(--accent);color:#0f0f0f;font-size:11px;font-weight:800;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-header input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:13px;font-weight:600;padding:7px 10px;outline:none}
.step-header input:focus{border-color:var(--accent)}
.step-body textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:12px;padding:7px 10px;outline:none;resize:vertical;min-height:50px}
.step-body textarea:focus{border-color:var(--accent)}
.step-meta{display:flex;gap:8px;margin-top:8px}
.step-meta input,.step-meta select{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:12px;padding:6px 10px;outline:none}
.step-meta input:focus,.step-meta select:focus{border-color:var(--accent)}
.step-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.btn-xs{background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--muted);font-size:11px;padding:3px 8px;cursor:pointer;font-family:var(--font)}
.btn-xs:hover{color:var(--danger);border-color:var(--danger)}
.add-step-btn{background:transparent;border:1px dashed var(--border2);border-radius:8px;color:var(--muted);font-size:13px;font-family:var(--font);padding:9px;width:100%;cursor:pointer;transition:.15s;margin-top:4px}
.add-step-btn:hover{color:var(--accent);border-color:var(--accent)}
/* preview */
.preview-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;position:sticky;top:80px}
.sop-doc{background:#fff;color:#111;border-radius:6px;padding:28px;font-size:13px;line-height:1.7;max-height:75vh;overflow-y:auto;font-family:Arial,sans-serif}
.sop-doc .header-band{background:#0f0f0f;color:#c8f135;padding:16px 20px;border-radius:4px;margin-bottom:20px}
.sop-doc .header-band h2{font-size:15px;font-weight:700;letter-spacing:.04em}
.sop-doc .header-band .meta{font-size:11px;color:#aaa;margin-top:4px}
.sop-doc h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#777;margin:18px 0 8px}
.sop-doc .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.sop-doc .info-cell{background:#f5f5f5;border-radius:4px;padding:8px 12px}
.sop-doc .info-cell .lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.06em}
.sop-doc .info-cell .val{font-size:13px;font-weight:600}
.sop-doc .step-row{display:flex;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #eee}
.sop-doc .step-row:last-child{border-bottom:none}
.sop-doc .step-circle{background:#0f0f0f;color:#c8f135;font-size:11px;font-weight:800;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.sop-doc .step-title{font-weight:700;margin-bottom:3px}
.sop-doc .step-desc{font-size:12px;color:#444}
.sop-doc .step-pill{display:inline-block;background:#eee;border-radius:10px;font-size:10px;padding:1px 8px;margin-top:4px;margin-right:4px;color:#555}
.action-row{display:flex;gap:8px;margin-top:14px}
.action-row button{flex:1;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}
.btn-primary{background:var(--accent);color:#0f0f0f}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
@media print{nav,footer,.layout>div:first-child,.action-row{display:none}.sop-doc{max-height:none;overflow:visible}body{background:#fff}}
footer{text-align:center;padding:32px 24px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--accent)}
</style>
</head>
<body>
<nav>
  <a href="https://zerokitapp.github.io" class="nav-logo">Zero<span>Kit</span></a>
  <span class="nav-tag">Tool 18 / 50</span>
</nav>
<div class="hero">
  <div class="hero-eyebrow">Freelance Tools · Tool 18</div>
  <h1>Document your process<br><em>once. Run it forever.</em></h1>
  <p>Build a Standard Operating Procedure for any recurring task. Add steps, owners, and time estimates — then print or share it.</p>
</div>
<div class="layout">
  <div>
    <div class="section">
      <div class="section-title">SOP Header</div>
      <div class="field"><label>SOP Title</label><input type="text" id="sopTitle" placeholder="e.g. Client Onboarding Process" oninput="render()"/></div>
      <div class="field"><label>Department / Team</label><input type="text" id="dept" placeholder="e.g. Operations" oninput="render()"/></div>
      <div class="grid2">
        <div class="field"><label>Version</label><input type="text" id="version" placeholder="v1.0" oninput="render()"/></div>
        <div class="field"><label>Date</label><input type="date" id="sopDate" oninput="render()"/></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Author</label><input type="text" id="author" placeholder="Your name" oninput="render()"/></div>
        <div class="field"><label>Reviewed By</label><input type="text" id="reviewer" placeholder="Optional" oninput="render()"/></div>
      </div>
      <div class="field"><label>Purpose / Objective</label><textarea id="purpose" placeholder="What does this SOP achieve?" oninput="render()"></textarea></div>
      <div class="field"><label>Scope (who this applies to)</label><input type="text" id="scope" placeholder="e.g. All project managers" oninput="render()"/></div>
      <div class="field"><label>Tools / Resources Needed</label><input type="text" id="tools" placeholder="e.g. Notion, Slack, Google Drive" oninput="render()"/></div>
    </div>
    <div class="section">
      <div class="section-title">Steps</div>
      <div id="stepsList"></div>
      <button class="add-step-btn" onclick="addStep()">+ Add Step</button>
    </div>
  </div>

  <div class="preview-card">
    <div class="section-title" style="margin-bottom:16px">Preview</div>
    <div class="sop-doc" id="sopDoc"></div>
    <div class="action-row">
      <button class="btn-secondary" onclick="copyText()">⎘ Copy</button>
      <button class="btn-primary" onclick="window.print()">⎙ Print / PDF</button>
    </div>
  </div>
</div>
<footer><a href="https://zerokitapp.github.io">ZeroKit</a> · Free Business Tools · No signup · No limits</footer>
<script>
let steps=[
  {id:1,title:'Receive client enquiry',desc:'Acknowledge receipt within 24 hours. Log details in CRM.',owner:'Account Manager',time:'15 min',warning:''},
  {id:2,title:'Send welcome email & onboarding form',desc:'Use the standard welcome email template. Attach the onboarding questionnaire.',owner:'Account Manager',time:'10 min',warning:''},
  {id:3,title:'Review completed onboarding form',desc:'Check for missing information and follow up if needed.',owner:'Project Lead',time:'30 min',warning:''},
];
document.getElementById('sopDate').value=new Date().toISOString().split('T')[0];

function addStep(){steps.push({id:Date.now(),title:'',desc:'',owner:'',time:'',warning:''});renderSteps();render();}
function removeStep(id){steps=steps.filter(s=>s.id!==id);renderSteps();render();}
function updateStep(id,key,val){const s=steps.find(x=>x.id===id);if(s){s[key]=val;}render();}

function renderSteps(){
  document.getElementById('stepsList').innerHTML=steps.map((s,i)=>`
    <div class="step-item">
      <div class="step-header">
        <div class="step-num">${i+1}</div>
        <input type="text" placeholder="Step title" value="${escHtml(s.title)}" oninput="updateStep(${s.id},'title',this.value)"/>
      </div>
      <div class="step-body">
        <textarea placeholder="Describe what to do in this step…" oninput="updateStep(${s.id},'desc',this.value)">${escHtml(s.desc)}</textarea>
      </div>
      <div class="step-meta">
        <input type="text" placeholder="Owner / role" value="${escHtml(s.owner)}" oninput="updateStep(${s.id},'owner',this.value)"/>
        <input type="text" placeholder="Time estimate" value="${escHtml(s.time)}" oninput="updateStep(${s.id},'time',this.value)"/>
      </div>
      <div class="step-actions">
        <button class="btn-xs" onclick="removeStep(${s.id})">✕ Remove</button>
      </div>
    </div>
  `).join('');
}

function render(){
  const title=document.getElementById('sopTitle').value||'Untitled SOP';
  const dept=document.getElementById('dept').value;
  const ver=document.getElementById('version').value||'v1.0';
  const dateVal=document.getElementById('sopDate').value;
  const dateStr=dateVal?new Date(dateVal).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';
  const author=document.getElementById('author').value;
  const reviewer=document.getElementById('reviewer').value;
  const purpose=document.getElementById('purpose').value;
  const scope=document.getElementById('scope').value;
  const tools=document.getElementById('tools').value;

  document.getElementById('sopDoc').innerHTML=`
    <div class="header-band">
      <h2>${escHtml(title)}</h2>
      <div class="meta">${dept?escHtml(dept)+' · ':''}${ver}${dateStr?' · '+dateStr:''}</div>
    </div>
    <div class="info-grid">
      ${author?`<div class="info-cell"><div class="lbl">Author</div><div class="val">${escHtml(author)}</div></div>`:''}
      ${reviewer?`<div class="info-cell"><div class="lbl">Reviewed By</div><div class="val">${escHtml(reviewer)}</div></div>`:''}
      ${scope?`<div class="info-cell"><div class="lbl">Scope</div><div class="val">${escHtml(scope)}</div></div>`:''}
      ${tools?`<div class="info-cell"><div class="lbl">Tools Needed</div><div class="val">${escHtml(tools)}</div></div>`:''}
    </div>
    ${purpose?`<h3>Purpose</h3><p style="font-size:13px;color:#444;margin-bottom:16px">${escHtml(purpose)}</p>`:''}
    <h3>Procedure</h3>
    ${steps.map((s,i)=>`
      <div class="step-row">
        <div class="step-circle">${i+1}</div>
        <div style="flex:1">
          <div class="step-title">${escHtml(s.title||'Untitled Step')}</div>
          ${s.desc?`<div class="step-desc">${escHtml(s.desc)}</div>`:''}
          ${s.owner?`<span class="step-pill">👤 ${escHtml(s.owner)}</span>`:''}
          ${s.time?`<span class="step-pill">⏱ ${escHtml(s.time)}</span>`:''}
        </div>
      </div>
    `).join('')}
    <p style="margin-top:20px;font-size:10px;color:#bbb;text-align:center">Generated with ZeroKit · zerokitapp.github.io</p>
  `;
}

function copyText(){
  const title=document.getElementById('sopTitle').value||'Untitled SOP';
  let text=`${title}\n${'='.repeat(40)}\n\n`;
  if(document.getElementById('purpose').value) text+=`PURPOSE\n${document.getElementById('purpose').value}\n\n`;
  text+=`STEPS\n-----\n`;
  steps.forEach((s,i)=>{
    text+=`${i+1}. ${s.title||'—'}\n`;
    if(s.desc) text+=`   ${s.desc}\n`;
    if(s.owner) text+=`   Owner: ${s.owner}\n`;
    if(s.time) text+=`   Time: ${s.time}\n`;
    text+='\n';
  });
  navigator.clipboard.writeText(text).then(()=>alert('SOP copied to clipboard!'));
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
renderSteps(); render();
</script>
</body>
</html>
