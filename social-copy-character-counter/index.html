<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Copy Character Counter — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
    button{cursor:pointer;font-family:inherit;}
    select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;margin-bottom:20px;}
    textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:16px;font-family:inherit;font-size:14px;width:100%;min-height:180px;resize:vertical;}
    textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
    .count-bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;}
    .count-bar .count{font-weight:700;}
    .count-bar .count.over{color:var(--danger);}
    .count-bar .count.ok{color:var(--accent);}
    .progress-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:8px;}
    .progress-fill{height:100%;background:var(--accent);transition:width 0.2s;}
    .progress-fill.over{background:var(--danger);}
    .limits-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:28px;}
    .limit-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
    .limit-card .platform{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;}
    .limit-card .status{font-size:20px;font-weight:800;margin-top:6px;}
    .limit-card .status.ok{color:var(--accent);}
    .limit-card .status.over{color:var(--danger);}
    .limit-card .limit-text{font-size:11px;color:var(--text-dim);margin-top:2px;}
    .hashtag-info{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-top:24px;font-size:13px;display:flex;justify-content:space-between;}
    .hashtag-info strong{color:var(--accent);}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">45</span>
  <span class="nav-title">Social Copy Character Counter</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>Social Copy Character Counter</h1>
  <p class="sub">Check your pin title, description, or post copy against platform character limits before you publish.</p>

  <select id="platformSelect" onchange="render()">
    <option value="pinTitle">Pinterest — Title (100 char limit)</option>
    <option value="pinDesc">Pinterest — Description (800 char limit)</option>
    <option value="instaCaption">Instagram — Caption (2,200 char limit)</option>
    <option value="xPost">X / Twitter — Post (280 char limit)</option>
    <option value="tiktokCaption">TikTok — Caption (2,200 char limit)</option>
    <option value="fbPost">Facebook — Post (63,206 char limit, ~500 recommended)</option>
  </select>

  <textarea id="copyInput" placeholder="Paste or write your copy here..." oninput="render()"></textarea>

  <div class="count-bar">
    <span>Characters: <span class="count" id="charCount">0</span> / <span id="charLimit">100</span></span>
    <span id="remainingText">100 remaining</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="hashtag-info">
    <span>Words: <strong id="wordCount">0</strong></span>
    <span>Hashtags: <strong id="hashtagCount">0</strong></span>
  </div>

  <div class="limits-grid" id="allPlatforms"></div>
</div>

<script>
const LIMITS = {
  pinTitle: { name:'Pinterest Title', limit:100 },
  pinDesc: { name:'Pinterest Desc', limit:800 },
  instaCaption: { name:'Instagram', limit:2200 },
  xPost: { name:'X / Twitter', limit:280 },
  tiktokCaption: { name:'TikTok', limit:2200 },
  fbPost: { name:'Facebook', limit:500 }
};

function render(){
  const text = document.getElementById('copyInput').value;
  const platform = document.getElementById('platformSelect').value;
  const limit = LIMITS[platform].limit;
  const len = text.length;

  document.getElementById('charCount').textContent = len;
  document.getElementById('charLimit').textContent = limit;
  const remaining = limit - len;
  const remainingEl = document.getElementById('remainingText');
  remainingEl.textContent = remaining>=0 ? `${remaining} remaining` : `${Math.abs(remaining)} over limit`;
  remainingEl.style.color = remaining<0 ? 'var(--danger)' : 'var(--text-dim)';

  const countEl = document.getElementById('charCount');
  countEl.className = 'count ' + (len>limit ? 'over' : 'ok');

  const pct = Math.min(100, (len/limit)*100);
  const fill = document.getElementById('progressFill');
  fill.style.width = pct+'%';
  fill.className = 'progress-fill ' + (len>limit ? 'over' : '');

  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('wordCount').textContent = words;

  const hashtags = (text.match(/#[\w]+/g) || []).length;
  document.getElementById('hashtagCount').textContent = hashtags;

  const allGrid = document.getElementById('allPlatforms');
  allGrid.innerHTML = Object.entries(LIMITS).map(([key, info])=>{
    const over = len > info.limit;
    return `
      <div class="limit-card">
        <div class="platform">${info.name}</div>
        <div class="status ${over?'over':'ok'}">${len}/${info.limit}</div>
        <div class="limit-text">${over ? 'Over limit' : 'Fits'}</div>
      </div>
    `;
  }).join('');
}

render();
</script>
</body>
</html>
