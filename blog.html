<title>Blog — ZeroKit</title>
<meta name="description" content="Practical guides on freelancing, pricing, and running a small business — plus the free tools to help you act on them.">

<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
/* ===== ZeroKit Hub — shared design system ===== */
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface-2: #222222;
  --accent: #c8f135;
  --text: #eeeeee;
  --text-dim: #9a9a9a;
  --border: #2c2c2c;
  --radius: 10px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

img { max-width: 100%; display: block; }

/* ---- Nav ---- */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: rgba(15, 15, 15, 0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.01em;
}

.nav-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: var(--accent);
  color: #0f0f0f;
  font-weight: 800;
  font-size: 0.75rem;
}

.nav-links {
  display: flex;
  gap: 6px;
  align-items: center;
}

.nav-links a {
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.92rem;
  color: var(--text-dim);
  transition: color 0.15s ease, background 0.15s ease;
}

.nav-links a:hover,
.nav-links a.active {
  color: var(--text);
  background: var(--surface-2);
}

/* ---- Layout ---- */
.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 56px 24px 90px;
}

.hero {
  text-align: center;
  padding: 64px 24px 40px;
  max-width: 720px;
  margin: 0 auto;
}

.hero h1 {
  font-size: 2.4rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 14px;
}

.hero .accent-word { color: var(--accent); }

.hero p {
  color: var(--text-dim);
  font-size: 1.05rem;
  margin: 0 auto;
  max-width: 560px;
}

.hero-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-top: 24px;
}

.tag {
  font-size: 0.78rem;
  color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 999px;
}

/* ---- Category grid ---- */
.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-top: 36px;
}

.category-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 20px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  color: var(--text);
  transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
}

.category-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  background: var(--surface-2);
}

.category-card.active {
  border-color: var(--accent);
  background: var(--surface-2);
}

.category-card .cat-num {
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.category-card h3 {
  margin: 8px 0 6px;
  font-size: 1.05rem;
}

.category-card p {
  margin: 0;
  color: var(--text-dim);
  font-size: 0.85rem;
}

.category-card .cat-count {
  display: inline-block;
  margin-top: 12px;
  font-size: 0.75rem;
  color: var(--text-dim);
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 999px;
}

/* ---- Tool panel ---- */
.tool-panel {
  margin-top: 28px;
  display: none;
}

.tool-panel.open { display: block; }

.tool-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.tool-panel-header h2 {
  font-size: 1.15rem;
  margin: 0;
}

.close-panel {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.82rem;
  cursor: pointer;
  font-family: inherit;
}

.close-panel:hover { color: var(--text); border-color: var(--accent); }

.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}

.tool-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: inherit;
  font-size: 0.92rem;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}

.tool-btn:hover {
  border-color: var(--accent);
  background: var(--surface-2);
  transform: translateX(2px);
}

.tool-btn .num {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--bg);
  color: var(--accent);
  font-size: 0.7rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tool-btn .arrow {
  margin-left: auto;
  color: var(--text-dim);
}

/* ---- Sections / prose pages ---- */
.page-title {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
}

.page-subtitle {
  color: var(--text-dim);
  margin: 0 0 40px;
  max-width: 640px;
}

.prose h2 {
  font-size: 1.3rem;
  margin: 40px 0 12px;
}

.prose p {
  color: #c9c9c9;
  margin: 0 0 14px;
}

.prose ul { color: #c9c9c9; padding-left: 20px; }
.prose li { margin-bottom: 6px; }

/* ---- Donation block ---- */
.donate-block {
  margin-top: 56px;
  padding: 36px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  display: flex;
  flex-wrap: wrap;
  gap: 32px;
  align-items: center;
  justify-content: space-between;
}

.donate-copy h2 { margin: 0 0 10px; font-size: 1.25rem; }
.donate-copy p { color: var(--text-dim); margin: 0 0 18px; max-width: 420px; }

.paypal-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--accent);
  color: #0f0f0f;
  font-weight: 700;
  padding: 13px 22px;
  border-radius: 10px;
  font-size: 0.95rem;
  border: none;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.paypal-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(200, 241, 53, 0.18);
}

.qr-wrap {
  text-align: center;
  flex-shrink: 0;
}

.qr-wrap img {
  width: 140px;
  height: 140px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #fff;
  padding: 8px;
}

.qr-wrap span {
  display: block;
  margin-top: 8px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* ---- Contact card ---- */
.contact-card {
  margin-top: 20px;
  padding: 20px 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.contact-card .label {
  color: var(--text-dim);
  font-size: 0.85rem;
}

.contact-card a.email-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.88rem;
  transition: border-color 0.15s ease;
}

.contact-card a.email-btn:hover { border-color: var(--accent); }

/* ---- About Tools listing ---- */
.at-category {
  margin-top: 44px;
}

.at-category h2 {
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}

.at-category .cat-desc {
  color: var(--text-dim);
  font-size: 0.9rem;
  margin: 0 0 18px;
}

.at-tool {
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.at-tool:last-child { border-bottom: none; }

.at-tool .num {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: var(--surface-2);
  color: var(--accent);
  font-size: 0.75rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
}

.at-tool-body h3 {
  margin: 0 0 4px;
  font-size: 1rem;
}

.at-tool-body p {
  margin: 0 0 8px;
  color: var(--text-dim);
  font-size: 0.9rem;
}

.at-tool-body a.open-link {
  font-size: 0.82rem;
  color: var(--accent);
}

/* ---- Footer ---- */
.footer {
  border-top: 1px solid var(--border);
  padding: 28px 24px;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.82rem;
}

.footer a { color: var(--text-dim); }
.footer a:hover { color: var(--accent); }

/* ---- Blog listing ---- */
.blog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
  margin-top: 32px;
}

.blog-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
}

.blog-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  background: var(--surface-2);
}

.blog-card .blog-cat {
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.blog-card h2 {
  margin: 10px 0 8px;
  font-size: 1.15rem;
  line-height: 1.3;
}

.blog-card p {
  margin: 0 0 16px;
  color: var(--text-dim);
  font-size: 0.9rem;
  line-height: 1.55;
}

.blog-card .blog-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.78rem;
  color: var(--text-dim);
}

.blog-card .read-more {
  color: var(--accent);
  font-weight: 600;
}

/* ---- Article page ---- */
.article-header {
  margin-bottom: 8px;
}

.article-cat {
  display: inline-block;
  color: var(--accent);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.article-meta {
  color: var(--text-dim);
  font-size: 0.85rem;
  margin: 0 0 40px;
}

.article-body h2 {
  font-size: 1.3rem;
  margin: 36px 0 14px;
}

.article-body h3 {
  font-size: 1.1rem;
  margin: 28px 0 10px;
}

.article-body p {
  color: #c9c9c9;
  margin: 0 0 16px;
  font-size: 1rem;
  line-height: 1.7;
}

.article-body ul, .article-body ol {
  color: #c9c9c9;
  padding-left: 22px;
  margin: 0 0 16px;
  line-height: 1.7;
}

.article-body li { margin-bottom: 8px; }

.article-body strong { color: var(--text); }

/* ---- Tool CTA box (embedded in articles) ---- */
.tool-cta {
  margin: 32px 0;
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.tool-cta-copy strong {
  display: block;
  font-size: 1rem;
  margin-bottom: 4px;
  color: var(--text);
}

.tool-cta-copy span {
  color: var(--text-dim);
  font-size: 0.88rem;
}

.tool-cta-btn {
  flex-shrink: 0;
  background: var(--accent);
  color: #0f0f0f;
  font-weight: 700;
  padding: 11px 20px;
  border-radius: 8px;
  font-size: 0.88rem;
  white-space: nowrap;
}

.tool-cta-btn:hover { opacity: 0.9; }

.back-to-blog {
  display: inline-block;
  margin-top: 48px;
  color: var(--text-dim);
  font-size: 0.9rem;
  border-top: 1px solid var(--border);
  padding-top: 24px;
  width: 100%;
}

.back-to-blog:hover { color: var(--accent); }

/* ---- Responsive ---- */
@media (max-width: 640px) {
  .hero h1 { font-size: 1.8rem; }
  .nav { padding: 12px 16px; }
  .nav-links a { padding: 7px 10px; font-size: 0.85rem; }
  .container { padding: 36px 16px 70px; }
  .donate-block { flex-direction: column; align-items: stretch; text-align: center; }
  .qr-wrap { margin: 0 auto; }
  .tool-cta { flex-direction: column; align-items: stretch; text-align: center; }
}


</style>
</head>

<script>
  const grid = document.getElementById('blogGrid');

  if (ZEROKIT_BLOG_POSTS.length === 0) {
    grid.innerHTML = '<p style="color: var(--text-dim);">No posts yet — check back soon.</p>';
  } else {
    ZEROKIT_BLOG_POSTS.forEach(post => {
      const card = document.createElement('a');
      card.className = 'blog-card';
      card.href = post.slug;
      card.style.display = 'block';
      card.innerHTML = `
        <div class="blog-cat">${post.category}</div>
        <h2>${post.title}</h2>
        <p>${post.excerpt}</p>
        <div class="blog-meta">
          <span>${post.date} · ${post.readTime}</span>
          <span class="read-more">Read more →</span>
        </div>
      `;
      grid.appendChild(card);
    });
  }
</script>
