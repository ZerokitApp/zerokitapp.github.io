<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Planner — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:1200px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 24px;}
    button{cursor:pointer;font-family:inherit;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
    textarea{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;width:100%;resize:none;min-height:200px;padding:0;}
    textarea:focus{outline:none;}
    .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
    .week-label{font-size:14px;font-weight:600;color:var(--text-dim);}
    .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;}
    .day-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;}
    .day-card.today{border-color:var(--accent);}
    .day-header{font-size:13px;font-weight:700;margin-bottom:2px;}
    .day-date{font-size:11px;color:var(--text-dim);margin-bottom:10px;}
    .priorities{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
    .priorities label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:500px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">36</span>
  <span class="nav-title">Weekly Planner</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>Weekly Planner</h1>
  <p class="sub">Plan notes and top priorities for each day of the week. Auto-saves as you type.</p>

  <div class="top-row">
    <button class="btn-ghost" onclick="shiftWeek(-1)">← Prev week</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="btn-ghost" onclick="shiftWeek(1)">Next week →</button>
  </div>

  <div class="grid" id="weekGrid"></div>
</div>

<script>
const STORAGE_PREFIX = 'zerokit_weekplan_';
let weekOffset = 0;

function dateKey(d){ return d.toISOString().split('T')[0]; }

function getWeekDates(){
  const today = new Date();
  const monday = new Date(today);
  const dayOfWeek = (today.getDay()+6)%7;
  monday.setDate(today.getDate() - dayOfWeek + weekOffset*7);
  const dates = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    dates.push(d);
  }
  return dates;
}

function shiftWeek(delta){
  weekOffset += delta;
  render();
}

function loadDay(key){
  return JSON.parse(localStorage.getItem(STORAGE_PREFIX+key) || '{"notes":"","priorities":""}');
}

function saveDay(key, data){
  localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(data));
}

function updateField(key, field, value){
  const data = loadDay(key);
  data[field] = value;
  saveDay(key, data);
}

function render(){
  const dates = getWeekDates();
  const monthFmt = d => d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  document.getElementById('weekLabel').textContent = `${monthFmt(dates[0])} – ${monthFmt(dates[6])}`;
  const todayKey = dateKey(new Date());

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = dates.map(d=>{
    const key = dateKey(d);
    const data = loadDay(key);
    const isToday = key===todayKey;
    return `
      <div class="day-card ${isToday?'today':''}">
        <div class="day-header">${d.toLocaleDateString(undefined,{weekday:'long'})}</div>
        <div class="day-date">${d.toLocaleDateString(undefined,{month:'short', day:'numeric'})}</div>
        <textarea placeholder="Notes & tasks..." oninput="updateField('${key}','notes',this.value)">${escapeHtml(data.notes)}</textarea>
        <div class="priorities">
          <label>Top priority</label>
          <textarea style="min-height:40px;" placeholder="One key focus..." oninput="updateField('${key}','priorities',this.value)">${escapeHtml(data.priorities)}</textarea>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

render();
</script>
</body>
</html>
