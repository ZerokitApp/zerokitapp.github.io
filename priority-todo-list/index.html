<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priority To-Do List — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:720px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
    button{cursor:pointer;font-family:inherit;}
    .btn{background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;font-size:12px;}
    input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;}
    input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
    .add-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
    .add-row input[type="text"]{flex:1;min-width:180px;}
    .filters{display:flex;gap:8px;margin-bottom:16px;}
    .filter-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;}
    .filter-btn.active{background:var(--accent);color:#0f0f0f;border-color:var(--accent);}
    .task-item{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;}
    .task-item.p-high{border-left-color:#ff5c5c;}
    .task-item.p-medium{border-left-color:#ffc14a;}
    .task-item.p-low{border-left-color:#5ac8fa;}
    .task-item.done{opacity:0.5;}
    .task-item.done .task-text{text-decoration:line-through;}
    .task-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);}
    .task-content{flex:1;}
    .task-text{font-size:14px;font-weight:500;}
    .task-meta{display:flex;gap:8px;margin-top:6px;align-items:center;}
    .prio-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:2px 8px;border-radius:10px;}
    .prio-tag.high{background:rgba(255,92,92,0.15);color:#ff8787;}
    .prio-tag.medium{background:rgba(255,193,74,0.15);color:#ffc14a;}
    .prio-tag.low{background:rgba(90,200,250,0.15);color:#5ac8fa;}
    .due-date{font-size:11px;color:var(--text-dim);}
    .task-item button{background:none;border:none;color:var(--text-dim);font-size:14px;align-self:flex-start;}
    .task-item button:hover{color:var(--danger);}
    .empty-state{text-align:center;color:var(--text-dim);padding:40px 0;font-size:14px;}
    .count-bar{font-size:12px;color:var(--text-dim);margin-bottom:16px;}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">38</span>
  <span class="nav-title">Priority To-Do List</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>Priority To-Do List</h1>
  <p class="sub">Track tasks with priority levels and due dates so the important stuff never gets buried.</p>

  <div class="add-row">
    <input type="text" id="taskInput" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addTask()">
    <select id="prioSelect">
      <option value="high">High</option>
      <option value="medium" selected>Medium</option>
      <option value="low">Low</option>
    </select>
    <input type="date" id="dueInput">
    <button class="btn" onclick="addTask()">Add</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
    <button class="filter-btn" data-filter="active" onclick="setFilter('active')">Active</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter('done')">Done</button>
  </div>

  <div class="count-bar" id="countBar"></div>
  <div id="taskList"></div>
</div>

<script>
const STORAGE_KEY = 'zerokit_priority_todo';
let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let filter = 'all';

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

function addTask(){
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if(!text) return;
  const priority = document.getElementById('prioSelect').value;
  const due = document.getElementById('dueInput').value;
  tasks.push({ id: Date.now(), text, priority, due, done:false });
  input.value=''; document.getElementById('dueInput').value='';
  save();
  render();
}

function toggleDone(id){
  const t = tasks.find(t=>t.id===id);
  if(t) t.done = !t.done;
  save();
  render();
}

function removeTask(id){
  tasks = tasks.filter(t=>t.id!==id);
  save();
  render();
}

function setFilter(f){
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active', b.dataset.filter===f));
  render();
}

const PRIO_ORDER = {high:0, medium:1, low:2};

function render(){
  let list = tasks.slice();
  if(filter==='active') list = list.filter(t=>!t.done);
  if(filter==='done') list = list.filter(t=>t.done);
  list.sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    return PRIO_ORDER[a.priority]-PRIO_ORDER[b.priority];
  });

  const activeCount = tasks.filter(t=>!t.done).length;
  document.getElementById('countBar').textContent = `${activeCount} active · ${tasks.length} total`;

  const container = document.getElementById('taskList');
  if(list.length===0){
    container.innerHTML = '<div class="empty-state">Nothing here. Add a task above.</div>';
    return;
  }

  container.innerHTML = list.map(t=>{
    const dueText = t.due ? new Date(t.due+'T00:00:00').toLocaleDateString(undefined,{month:'short', day:'numeric'}) : '';
    return `
      <div class="task-item p-${t.priority} ${t.done?'done':''}">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleDone(${t.id})">
        <div class="task-content">
          <div class="task-text">${escapeHtml(t.text)}</div>
          <div class="task-meta">
            <span class="prio-tag ${t.priority}">${t.priority}</span>
            ${dueText ? `<span class="due-date">Due ${dueText}</span>` : ''}
          </div>
        </div>
        <button onclick="removeTask(${t.id})">✕</button>
      </div>
    `;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

render();
</script>
</body>
</html>
