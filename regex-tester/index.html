<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regex Tester — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:900px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
    button{cursor:pointer;font-family:inherit;}
    input,textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:12px 14px;font-family:'SF Mono',Consolas,monospace;font-size:14px;width:100%;}
    input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
    .pattern-row{display:flex;gap:10px;margin-bottom:8px;align-items:center;}
    .pattern-row .slash{color:var(--text-dim);font-size:18px;font-weight:700;}
    .flags-input{width:80px;flex-shrink:0;}
    .flags-hint{font-size:12px;color:var(--text-dim);margin-bottom:20px;}
    textarea#testString{min-height:140px;resize:vertical;margin-bottom:20px;font-family:'SF Mono',Consolas,monospace;}
    .status-bar{padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:20px;}
    .status-bar.valid{background:rgba(200,241,53,0.1);color:var(--accent);border:1px solid rgba(200,241,53,0.3);}
    .status-bar.invalid{background:rgba(255,92,92,0.1);color:#ff8787;border:1px solid rgba(255,92,92,0.3);}
    .result-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;font-family:monospace;font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;min-height:60px;margin-bottom:20px;}
    mark{background:var(--accent);color:#0f0f0f;border-radius:3px;padding:0 2px;}
    .matches-list{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
    .match-item{font-family:monospace;font-size:13px;padding:8px 10px;background:var(--surface2);border-radius:6px;margin-bottom:6px;}
    .match-item .idx{color:var(--text-dim);margin-right:8px;}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">49</span>
  <span class="nav-title">Regex Tester</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>Regex Tester</h1>
  <p class="sub">Test regular expressions against sample text and see matches highlighted live.</p>

  <div class="pattern-row">
    <span class="slash">/</span>
    <input type="text" id="patternInput" placeholder="Enter your regex pattern..." value="[A-Z][a-z]+">
    <span class="slash">/</span>
    <input type="text" id="flagsInput" class="flags-input" placeholder="flags" value="g">
  </div>
  <p class="flags-hint">Flags: g (global), i (case-insensitive), m (multiline), s (dotall)</p>

  <textarea id="testString" placeholder="Paste text to test against...">The Cozy Haven Finds Pinterest account posts three times daily.</textarea>

  <div class="status-bar" id="statusBar"></div>

  <div class="result-box" id="highlightedResult"></div>

  <h3 style="font-size:15px;margin-bottom:10px;">Matches</h3>
  <div class="matches-list" id="matchesList"></div>
</div>

<script>
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(){
  const patternStr = document.getElementById('patternInput').value;
  const flags = document.getElementById('flagsInput').value;
  const testStr = document.getElementById('testString').value;
  const statusBar = document.getElementById('statusBar');
  const resultBox = document.getElementById('highlightedResult');
  const matchesList = document.getElementById('matchesList');

  if(!patternStr){
    statusBar.className = 'status-bar invalid';
    statusBar.textContent = 'Enter a pattern to begin';
    resultBox.innerHTML = escapeHtml(testStr);
    matchesList.innerHTML = '';
    return;
  }

  let regex;
  try{
    regex = new RegExp(patternStr, flags);
  }catch(e){
    statusBar.className = 'status-bar invalid';
    statusBar.textContent = '✕ Invalid regex — ' + e.message;
    resultBox.innerHTML = escapeHtml(testStr);
    matchesList.innerHTML = '';
    return;
  }

  const matches = [];
  if(flags.includes('g')){
    let m;
    const re = new RegExp(patternStr, flags);
    while((m = re.exec(testStr)) !== null){
      matches.push(m);
      if(m[0]==='') re.lastIndex++;
    }
  } else {
    const m = testStr.match(regex);
    if(m) matches.push(m);
  }

  statusBar.className = 'status-bar valid';
  statusBar.textContent = `✓ Valid pattern — ${matches.length} match${matches.length!==1?'es':''} found`;

  // Highlight
  let highlighted = '';
  let lastIndex = 0;
  matches.forEach(m=>{
    const start = m.index;
    const end = start + m[0].length;
    highlighted += escapeHtml(testStr.slice(lastIndex, start));
    highlighted += '<mark>' + escapeHtml(testStr.slice(start,end)) + '</mark>';
    lastIndex = end;
  });
  highlighted += escapeHtml(testStr.slice(lastIndex));
  resultBox.innerHTML = highlighted || escapeHtml(testStr);

  // Match list
  if(matches.length===0){
    matchesList.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">No matches.</p>';
  } else {
    matchesList.innerHTML = matches.map((m,i)=>{
      const groups = m.length>1 ? ' → groups: ' + m.slice(1).map(g=>g===undefined?'∅':`"${g}"`).join(', ') : '';
      return `<div class="match-item"><span class="idx">#${i+1} @${m.index}</span>"${escapeHtml(m[0])}"${escapeHtml(groups)}</div>`;
    }).join('');
  }
}

document.getElementById('patternInput').addEventListener('input', render);
document.getElementById('flagsInput').addEventListener('input', render);
document.getElementById('testString').addEventListener('input', render);

render();
</script>
</body>
</html>
