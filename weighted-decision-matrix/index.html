<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weighted Decision Matrix — ZeroKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222222; --border:#2a2a2a;
      --accent:#c8f135; --text:#f2f2f2; --text-dim:#9a9a9a; --danger:#ff5c5c;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;background:rgba(15,15,15,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:14px 24px;}
    .badge{background:var(--accent);color:#0f0f0f;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;}
    .nav-title{font-weight:600;font-size:15px;}
    .nav-back{margin-left:auto;font-size:13px;color:var(--text-dim);}
    .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 80px;}
    h1{font-size:28px;font-weight:700;margin:0 0 6px;}
    .sub{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
    button{cursor:pointer;font-family:inherit;}
    .btn{background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
    input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:13px;}
    input:focus{outline:2px solid var(--accent);outline-offset:1px;}
    .toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-x:auto;padding:16px;}
    table{border-collapse:collapse;width:100%;min-width:640px;}
    th,td{padding:8px;text-align:center;font-size:13px;border-bottom:1px solid var(--border);}
    th{color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;}
    td.option-name{text-align:left;font-weight:600;}
    td.option-name input{width:140px;}
    .crit-header input{width:110px;text-align:center;}
    .weight-input{width:50px;text-align:center;}
    .score-input{width:50px;text-align:center;}
    .total-cell{font-weight:700;color:var(--accent);font-size:15px;}
    .winner{background:rgba(200,241,53,0.08);}
    .remove-btn{background:none;border:none;color:var(--text-dim);font-size:13px;}
    .remove-btn:hover{color:var(--danger);}
    .hint{font-size:12px;color:var(--text-dim);margin-bottom:16px;}
</style>
</head>
<body>
<div class="nav">
  <span class="badge">40</span>
  <span class="nav-title">Weighted Decision Matrix</span>
  <span class="nav-back">ZeroKit</span>
</div>
<div class="wrap">
  <h1>Weighted Decision Matrix</h1>
  <p class="sub">Compare options against weighted criteria to make a more objective decision.</p>
  <p class="hint">Score each option 1–5 per criterion. Weights multiply the score. Highest total wins.</p>

  <div class="toolbar">
    <button class="btn-ghost" onclick="addOption()">+ Add option</button>
    <button class="btn-ghost" onclick="addCriterion()">+ Add criterion</button>
    <button class="btn-ghost" onclick="resetAll()">Reset</button>
  </div>

  <div class="table-wrap">
    <table id="matrixTable"></table>
  </div>
</div>

<script>
const STORAGE_KEY = 'zerokit_decision_matrix';
let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {
  criteria: [{name:'Cost', weight:3}, {name:'Impact', weight:5}, {name:'Effort', weight:2}],
  options: [
    {name:'Option A', scores:{}},
    {name:'Option B', scores:{}}
  ]
};

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function addOption(){
  data.options.push({name:'New option', scores:{}});
  save(); render();
}

function addCriterion(){
  const id = 'c'+Date.now();
  data.criteria.push({name:'New criterion', weight:1, id});
  save(); render();
}

function removeOption(idx){
  data.options.splice(idx,1);
  save(); render();
}

function removeCriterion(idx){
  data.criteria.splice(idx,1);
  save(); render();
}

function updateOptionName(idx, value){
  data.options[idx].name = value;
  save();
}

function updateCriterionName(idx, value){
  data.criteria[idx].name = value;
  save();
}

function updateWeight(idx, value){
  data.criteria[idx].weight = parseFloat(value) || 0;
  save(); render();
}

function updateScore(optIdx, critIdx, value){
  const key = 'c'+critIdx;
  data.options[optIdx].scores[key] = parseFloat(value) || 0;
  save(); render();
}

function resetAll(){
  if(confirm('Clear the whole matrix?')){
    data = { criteria: [{name:'Cost', weight:3}], options: [{name:'Option A', scores:{}}] };
    save(); render();
  }
}

function computeTotal(option){
  return data.criteria.reduce((sum, crit, idx)=>{
    const score = option.scores['c'+idx] || 0;
    return sum + score * crit.weight;
  }, 0);
}

function render(){
  const totals = data.options.map(computeTotal);
  const maxTotal = Math.max(...totals, 0);

  let html = '<tr><th style="text-align:left;">Option</th>';
  data.criteria.forEach((c, idx)=>{
    html += `<th class="crit-header">
      <input type="text" value="${escapeAttr(c.name)}" onchange="updateCriterionName(${idx}, this.value)"><br>
      <span style="font-size:10px;">weight</span> <input type="number" class="weight-input" value="${c.weight}" min="0" max="10" onchange="updateWeight(${idx}, this.value)">
      <br><button class="remove-btn" onclick="removeCriterion(${idx})">remove</button>
    </th>`;
  });
  html += '<th>Total</th><th></th></tr>';

  data.options.forEach((opt, optIdx)=>{
    const total = totals[optIdx];
    const isWinner = total === maxTotal && total > 0;
    html += `<tr class="${isWinner?'winner':''}">`;
    html += `<td class="option-name"><input type="text" value="${escapeAttr(opt.name)}" onchange="updateOptionName(${optIdx}, this.value)"></td>`;
    data.criteria.forEach((c, critIdx)=>{
      const val = opt.scores['c'+critIdx] || '';
      html += `<td><input type="number" class="score-input" min="1" max="5" value="${val}" onchange="updateScore(${optIdx}, ${critIdx}, this.value)"></td>`;
    });
    html += `<td class="total-cell">${total.toFixed(1)}${isWinner ? ' 🏆' : ''}</td>`;
    html += `<td><button class="remove-btn" onclick="removeOption(${optIdx})">✕</button></td>`;
    html += '</tr>';
  });

  document.getElementById('matrixTable').innerHTML = html;
}

function escapeAttr(str){
  return String(str).replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
